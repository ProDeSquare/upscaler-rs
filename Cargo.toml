[package]
name = "realesrgan"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.5", features = ["trace", "limit", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = "0.25"
ndarray = "0.17"
anyhow = "1"
dotenvy = "0.15.7"
serde = { version = "1.0", features = ["derive"] }

ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "cuda", "load-dynamic", "tls-rustls", "ndarray"] }

[profile.release]
opt-level = 3
lto = true
